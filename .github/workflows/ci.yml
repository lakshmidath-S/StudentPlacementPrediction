name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Type-check · Test · Smoke-test
    runs-on: ubuntu-latest

    # No API key is configured, deliberately. CI exercises the rule-based
    # planner — the path a fresh clone and any key-less deployment take. If that
    # path stops producing a trainable model, this build must go red.
    env:
      LLM_PROVIDER: "off"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: Lint with ruff
        run: ruff check . --output-format=github

      - name: Type check with pyright
        run: pyright --project pyrightconfig.json
        continue-on-error: true   # advisory — does not block merge

      - name: Run the test suite
        run: pytest tests/ -q --tb=short

      # The hard gate. Nothing is pre-trained in this repo, so the check is to
      # run what the product runs: train on the bundled sample, save the bundle,
      # reload it from disk, predict, and confirm drift reads clean.
      - name: Smoke-test the full train/predict loop
        run: python scripts/smoke_test.py
