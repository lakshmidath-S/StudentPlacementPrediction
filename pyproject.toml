[project]
name = "adaptive-placement-intelligence"
version = "2.0.0"
description = "LLM-orchestrated AutoML: upload a spreadsheet, get a trained model you own"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "workspaces",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort (import sorting)
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line too long (wrapping is a formatting concern)
]

[tool.ruff.lint.isort]
known-first-party = ["placement_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    # joblib still assigns to ndarray.shape, which NumPy 2.5 deprecated. It is
    # third-party and unactionable here, and 200+ copies of it per run bury the
    # warnings that are actually ours.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
